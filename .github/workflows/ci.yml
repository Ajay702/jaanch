name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub's Ubuntu runners ship Google Chrome; Jaanch falls back to it when Brave isn't installed.
      - run: npm test
        env:
          JAANCH_OFFLINE: '1'
